name: RubbingMind CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main, "feature/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubbingmind-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend CI (Python & Algorithms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Provenance tests measure distance from the frozen mechanism commit.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security & Secret scan
        run: |
          python scripts/security_scan.py

      - name: Initialize SQLite Database
        run: |
          python scripts/init_db.py

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest tests/ -v

      - name: Validate museum catalogue and all runtime images
        run: python scripts/validate_museum_v3.py

      - name: Validate historical GIS and stored paired experiment metrics
        run: |
          python scripts/validate_history_gis.py
          python scripts/verify_experiment_evidence.py

  frontend-build:
    name: Frontend CI (React & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: TypeScript Check & Vite Build
        working-directory: apps/web
        run: |
          npm run test:url
          npm run build

  repository-validation:
    name: Repository & Assets Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Key Artifacts & Manifest Integrity
        run: |
          test -f data/museum_database.json
          test -f .env.example
          test -f .gitignore
          test -f screenshots/01_home_portal_3d.png
          test -f screenshots/02_digital_museum.png
          test -f screenshots/03_restoration_workbench.png
          test -f screenshots/04_graphrag_gis.png
          test -f screenshots/05_ablation_reports.png
          test -f screenshots/sync-verification/1920x1080/01-home.png
          test -f screenshots/sync-verification/1920x1080/02-museum.png
          test -f screenshots/sync-verification/1920x1080/03-workbench.png
          test -f screenshots/sync-verification/1920x1080/04-graph.png
          test -f screenshots/sync-verification/1920x1080/05-reports.png
          test -f screenshots/sync-verification/reports/02-real-image-comparison.png
          echo "All critical repository files and screenshots verified successfully."

  browser-smoke:
    name: Browser smoke (online and fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies and Chromium
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          cd apps/web && npm ci
      - name: Build the frontend preview
        working-directory: apps/web
        run: npm run build
      - name: Start backend, verify /health and /generate, then start preview
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/rubbingmind-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health > /dev/null
          curl -fsS http://127.0.0.1:8000/generate > /dev/null
          cd apps/web
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/rubbingmind-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
      - name: Verify browser navigation and catalogue
        env:
          RUBBINGMIND_FRONTEND_URL: http://127.0.0.1:4173
        run: python scripts/ci_browser_smoke.py
      - name: Verify homepage ambient media without claiming codec playback
        env:
          RUBBINGMIND_FRONTEND_URL: http://127.0.0.1:4173
        run: python scripts/test_home_ambient_video_browser.py --ci
      - name: Verify adaptive workflow, evidence retrieval and real experiment UI
        run: python scripts/test_technical_v2_browser.py --ci --url http://127.0.0.1:4173
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p screenshots/ci-smoke
          cp /tmp/rubbingmind-api.log screenshots/ci-smoke/api.log || true
          cp /tmp/rubbingmind-web.log screenshots/ci-smoke/web.log || true
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            screenshots/ci-smoke/
            screenshots/technical-v2/
          if-no-files-found: warn
          retention-days: 7
